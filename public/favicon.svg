<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Soft matte sticker gradient -->
    <linearGradient id="stickerFace" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Curled paper flap gradient -->
    <linearGradient id="flapGrad" x1="36" y1="28" x2="51" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Shadow cast by the curled flap onto the sticker -->
    <filter id="flapShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-2" dy="2.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>

    <!-- Squircle clip so the peeled corner follows the iOS rounded square -->
    <clipPath id="squircleClip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Main White Sticker Squircle -->
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#stickerFace)"/>

    <!-- Exposed Top-Right Backing Split into Baby Blue & Blush Pink -->
    <!-- Top-left half of exposed corner: Baby Blue -->
    <polygon points="34,4 60,4 47,17" fill="#0284C7"/>
    <!-- Bottom-right half of exposed corner: Blush Pink -->
    <polygon points="60,4 60,30 47,17" fill="#F43F5E"/>

    <!-- Subtle inner shadow inside the exposed corner -->
    <polygon points="34,4 60,4 60,30" fill="#0F172A" fill-opacity="0.08"/>

    <!-- Minimalist Thermal Label Ink Lines -->
    <rect x="14" y="30" width="22" height="5" rx="2.5" fill="#1E293B"/>
    <rect x="14" y="40" width="32" height="5" rx="2.5" fill="#1E293B"/>

    <!-- Peeling Corner Flap -->
    <g filter="url(#flapShadow)">
      <path d="M34 4 L34 24 C34 27.3137 36.6863 30 40 30 L60 30 Z" fill="url(#flapGrad)"/>
      <line x1="34" y1="4" x2="60" y2="30" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.9"/>
    </g>
  </g>

  <!-- Subtle outer border for contrast on light browser tabs -->
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" stroke="#E2E8F0" stroke-width="1.5"/>
</svg>
